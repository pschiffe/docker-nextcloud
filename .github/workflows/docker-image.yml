name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
permissions:
  contents: read

concurrency:
  group: docker-image-publish
  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Check Out Repo
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          builder: ${{ steps.buildx.outputs.name }}
          load: true
          tags: nextcloud:smoke

      - name: Smoke test image
        run: .github/scripts/smoke-test.sh nextcloud:smoke

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nextcloud:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/nextcloud:sha-${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
